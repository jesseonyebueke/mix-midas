<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" role="img" aria-labelledby="title desc">
  <title id="title">MixMidas booking sequence diagram</title>
  <desc id="desc">A customer submits a booking through the browser, Django validates it, checks the database and returns either confirmation or errors.</desc>
  <rect width="1240" height="900" fill="#ffffff"/>
  <style>
    .title { font: 700 29px Arial, sans-serif; fill: #10264d; }
    .head { fill: #eef5ff; stroke: #0757d9; stroke-width: 2; }
    .actor, .line { fill: none; stroke: #10264d; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .life { stroke: #8ba4ca; stroke-width: 1.5; stroke-dasharray: 7 7; }
    .message { stroke: #10264d; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .return { stroke: #60708b; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; marker-end: url(#arrow-muted); }
    .label { font: 600 16px Arial, sans-serif; fill: #10264d; text-anchor: middle; }
    .message-label { font: 500 14px Arial, sans-serif; fill: #10264d; text-anchor: middle; }
    .note { font: 500 14px Arial, sans-serif; fill: #60708b; text-anchor: middle; }
    .alt { fill: #fbfdff; stroke: #9abbed; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#10264d"/></marker>
    <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#60708b"/></marker>
  </defs>
  <text x="620" y="44" class="title" text-anchor="middle">MixMidas Booking Sequence Diagram</text>

  <!-- Customer stick figure -->
  <g transform="translate(110 102)" class="actor"><circle cx="0" cy="0" r="15"/><path d="M0 15v55M-28 35H28M0 70l-26 35M0 70l26 35"/></g>
  <text x="110" y="225" class="label">Customer</text>
  <rect x="270" y="156" width="160" height="52" rx="4" class="head"/><text x="350" y="188" class="label">Browser</text>
  <rect x="520" y="156" width="160" height="52" rx="4" class="head"/><text x="600" y="188" class="label">Django View</text>
  <rect x="770" y="156" width="160" height="52" rx="4" class="head"/><text x="850" y="188" class="label">BookingForm</text>
  <rect x="1010" y="156" width="160" height="52" rx="4" class="head"/><text x="1090" y="188" class="label">Database</text>

  <path d="M110 230V840M350 208V840M600 208V840M850 208V840M1090 208V840" class="life"/>

  <path d="M110 270H350" class="message"/><text x="230" y="260" class="message-label">1. Open booking page</text>
  <path d="M350 320H600" class="message"/><text x="475" y="310" class="message-label">2. GET /book/</text>
  <path d="M600 370H350" class="return"/><text x="475" y="360" class="message-label">3. Render booking form</text>
  <path d="M110 420H350" class="message"/><text x="230" y="410" class="message-label">4. Submit booking details</text>
  <path d="M350 470H600" class="message"/><text x="475" y="460" class="message-label">5. POST /book/</text>
  <path d="M600 520H850" class="message"/><text x="725" y="510" class="message-label">6. Validate form details</text>
  <path d="M850 570H1090" class="message"/><text x="970" y="560" class="message-label">7. Check time conflicts</text>
  <path d="M1090 620H850" class="return"/><text x="970" y="610" class="message-label">8. Return matching bookings</text>

  <rect x="492" y="650" width="630" height="165" class="alt"/>
  <text x="510" y="676" class="label" text-anchor="start">Valid booking</text>
  <path d="M850 710H1090" class="message"/><text x="970" y="700" class="message-label">9. Save booking record</text>
  <path d="M1090 755H600" class="return"/><text x="845" y="745" class="message-label">10. Booking saved</text>
  <path d="M600 795H350" class="return"/><text x="475" y="785" class="message-label">11. Show confirmation popup</text>
  <text x="760" y="847" class="note">If validation fails, Django returns the booking form with correction messages instead.</text>
</svg>
