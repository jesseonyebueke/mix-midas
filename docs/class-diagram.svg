<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-labelledby="title desc">
  <title id="title">MixMidas class diagram</title>
  <desc id="desc">The Booking model is created and validated by BookingForm, processed by Views, administered by BookingAdmin, and accessed by authenticated users.</desc>
  <rect width="1240" height="820" fill="#ffffff"/>
  <style>
    .title { font: 700 29px Arial, sans-serif; fill: #10264d; }
    .box { fill: #ffffff; stroke: #10264d; stroke-width: 2; }
    .box-head { fill: #eef5ff; stroke: #0757d9; stroke-width: 2; }
    .line { stroke: #10264d; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .name { font: 700 18px Arial, sans-serif; fill: #10264d; text-anchor: middle; }
    .item { font: 500 14px Arial, sans-serif; fill: #10264d; }
    .relation { font: 500 13px Arial, sans-serif; fill: #60708b; text-anchor: middle; }
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#10264d"/></marker></defs>
  <text x="620" y="45" class="title" text-anchor="middle">MixMidas Class Diagram</text>

  <!-- Booking -->
  <rect x="470" y="105" width="300" height="315" class="box"/>
  <rect x="470" y="105" width="300" height="55" class="box-head"/>
  <text x="620" y="139" class="name">Booking</text>
  <line x1="470" y1="160" x2="770" y2="160" class="box"/>
  <text x="490" y="188" class="item">+ name: String</text><text x="490" y="214" class="item">+ email: Email</text><text x="490" y="240" class="item">+ service: Service</text><text x="490" y="266" class="item">+ date: Date</text><text x="490" y="292" class="item">+ start_time: Time</text><text x="490" y="318" class="item">+ duration_hours: Integer</text><text x="490" y="344" class="item">+ project_details: Text</text><text x="490" y="370" class="item">+ created_at: DateTime</text>
  <line x1="470" y1="388" x2="770" y2="388" class="box"/><text x="490" y="412" class="item">+ total_cost: Integer</text>

  <!-- BookingForm -->
  <rect x="85" y="184" width="275" height="205" class="box"/><rect x="85" y="184" width="275" height="55" class="box-head"/><text x="222" y="218" class="name">BookingForm</text>
  <line x1="85" y1="239" x2="360" y2="239" class="box"/><text x="105" y="270" class="item">+ clean_start_time()</text><text x="105" y="299" class="item">+ clean()</text><text x="105" y="328" class="item">+ label_for_hour(hour)</text>

  <!-- Views -->
  <rect x="85" y="535" width="275" height="150" class="box"/><rect x="85" y="535" width="275" height="55" class="box-head"/><text x="222" y="569" class="name">Views</text>
  <line x1="85" y1="590" x2="360" y2="590" class="box"/><text x="105" y="622" class="item">+ home(request)</text><text x="105" y="652" class="item">+ book_session(request)</text>

  <!-- BookingAdmin -->
  <rect x="885" y="180" width="275" height="210" class="box"/><rect x="885" y="180" width="275" height="55" class="box-head"/><text x="1022" y="214" class="name">BookingAdmin</text>
  <line x1="885" y1="235" x2="1160" y2="235" class="box"/><text x="905" y="266" class="item">+ list_display</text><text x="905" y="295" class="item">+ list_filter</text><text x="905" y="324" class="item">+ search_fields</text><text x="905" y="353" class="item">+ ordering</text>

  <!-- User -->
  <rect x="885" y="535" width="275" height="150" class="box"/><rect x="885" y="535" width="275" height="55" class="box-head"/><text x="1022" y="569" class="name">Django User</text>
  <line x1="885" y1="590" x2="1160" y2="590" class="box"/><text x="905" y="622" class="item">+ username</text><text x="905" y="648" class="item">+ email</text><text x="905" y="674" class="item">+ is_staff / is_superuser</text>

  <path d="M360 286H470" class="line"/><text x="415" y="275" class="relation">creates and validates</text>
  <path d="M360 610L470 390" class="line"/><text x="410" y="495" class="relation">processes</text>
  <path d="M885 286H770" class="line"/><text x="828" y="275" class="relation">administers</text>
  <path d="M1022 535V390" class="line"/><text x="1090" y="472" class="relation">authenticated access</text>
</svg>
